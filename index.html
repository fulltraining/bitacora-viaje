<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1E3B2F" />
    <meta
      name="description"
      content="Bitácora de Viaje · diarios de viaje con fotografías y rutas GPX"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Bitácora de Viaje</title>

    <link rel="icon" href="/icons/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icono-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <a class="saltar-al-contenido" href="#contenido">Saltar al contenido</a>

    <div id="app" class="app">
      <!-- Cabecera editorial -->
      <header class="cabecera" id="cabecera">
        <div class="cabecera__marca">
          <a href="#/" class="marca" aria-label="Bitácora de Viaje, ir al inicio">
            <span class="marca__emblema" aria-hidden="true">
              <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
                <path
                  d="M6 26V9.5L16 4l10 5.5V26"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M12 26v-7.5h8V26M4 26h24"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <span class="marca__texto">
              <strong>Bitácora</strong>
              <em>de Viaje</em>
            </span>
          </a>
        </div>

        <nav class="cabecera__nav" id="nav-escritorio" aria-label="Navegación principal">
          <a href="#/viajes" data-nav="viajes">Mis viajes</a>
          <a href="#/perfil" data-nav="perfil">Perfil</a>
          <button type="button" class="boton boton--fantasma boton--pequeno" data-accion="salir">
            Cerrar sesión
          </button>
        </nav>

        <button
          type="button"
          class="cabecera__menu"
          id="boton-menu"
          aria-label="Abrir menú"
          aria-expanded="false"
        >
          <span></span><span></span><span></span>
        </button>
      </header>

      <!-- Contenido -->
      <main id="contenido" class="contenido" tabindex="-1">
        <div class="cargador-inicial" id="cargador-inicial">
          <div class="cargador-inicial__marca"></div>
          <p>Preparando la bitácora…</p>
        </div>
      </main>

      <!-- Pie editorial -->
      <footer class="pie" id="pie">
        <div class="pie__marca">
          <span class="marca__texto marca__texto--pie">
            <strong>Bitácora</strong><em>de Viaje</em>
          </span>
          <p class="pie__lema">Cada ruta merece un recuerdo escrito.</p>
        </div>
        <nav class="pie__enlaces" aria-label="Enlaces del pie">
          <a href="#/">Inicio</a>
          <a href="#/viajes">Mis viajes</a>
          <a href="#/perfil">Perfil</a>
          <a href="#/ajustes">Configuración</a>
        </nav>
        <p class="pie__legal">
          Mapas ©
          <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener"
            >colaboradores de OpenStreetMap</a
          >
        </p>
      </footer>

      <!-- Menú inferior (móvil) -->
      <nav class="nav-inferior" id="nav-inferior" aria-label="Navegación móvil">
        <a href="#/" data-nav="inicio">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3 10.5 12 3l9 7.5M5.5 9.5V21h13V9.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Inicio</span>
        </a>
        <a href="#/viajes" data-nav="viajes">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 5.5A1.5 1.5 0 0 1 5.5 4H18a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2V5.5Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
            <path
              d="M9 4v16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
          <span>Viajes</span>
        </a>
        <a href="#/perfil" data-nav="perfil">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle
              cx="12"
              cy="8.5"
              r="3.6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M4.8 20c.9-3.7 3.7-5.6 7.2-5.6s6.3 1.9 7.2 5.6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
          <span>Perfil</span>
        </a>
      </nav>
    </div>

    <!-- Capas superpuestas -->
    <div id="capa-notificaciones" class="capa-notificaciones" aria-live="polite"></div>
    <div id="capa-modal" class="capa-modal" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
